<!DOCTYPE html>
<html lang="fr" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Tannelli</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f7f2;font-family:Arial,Helvetica,sans-serif;color:#0a0a0a;">
  <!-- Preheader (hidden preview text) -->
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{preheader}}</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f7f2;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;background-color:#ffffff;border-radius:16px;overflow:hidden;">

          <!-- Header: logo on forest green -->
          <tr>
            <td align="center" style="background-color:#40533d;padding:28px 24px;">
              <a href="{{siteUrl}}" target="_blank" style="text-decoration:none;">
                <img src="{{logoUrl}}" alt="Tannelli" width="180" style="display:block;border:0;outline:none;text-decoration:none;height:auto;max-width:180px;" />
              </a>
            </td>
          </tr>

          <!-- Lime accent stripe -->
          <tr>
            <td style="background-color:#9ad83a;height:4px;line-height:4px;font-size:4px;">&nbsp;</td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:36px 32px 24px 32px;">
              <h1 style="margin:0 0 16px 0;font-size:24px;line-height:1.3;font-weight:700;color:#1f3a1c;">{{title}}</h1>
              <p style="margin:0 0 16px 0;font-size:16px;line-height:1.6;color:#0a0a0a;">{{greeting}}</p>
              <p style="margin:0 0 24px 0;font-size:16px;line-height:1.6;color:#0a0a0a;">{{message}}</p>

              <!-- Optional summary box (order details, request details) -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f7f2;border-radius:12px;margin:0 0 28px 0;">
                <tr>
                  <td style="padding:20px 22px;font-size:14px;line-height:1.7;color:#40533d;">
                    {{summary}}
                  </td>
                </tr>
              </table>

              <!-- Call to action -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 auto 8px auto;">
                <tr>
                  <td align="center" style="border-radius:999px;background-color:#40533d;">
                    <a href="{{ctaUrl}}" target="_blank" style="display:inline-block;padding:14px 32px;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:999px;">{{ctaLabel}}</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="padding:0 32px;">
              <div style="height:1px;background-color:#ececec;line-height:1px;font-size:1px;">&nbsp;</div>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding:24px 32px 32px 32px;font-size:13px;line-height:1.6;color:#6b7280;">
              <p style="margin:0 0 8px 0;">{{footerNote}}</p>
              <p style="margin:0 0 8px 0;">
                <a href="{{siteUrl}}" style="color:#40533d;text-decoration:underline;">Tannelli</a>
              </p>
              <p style="margin:0;font-size:12px;color:#9ca3af;">&copy; {{year}} Tannelli. Tous droits réservés.</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
